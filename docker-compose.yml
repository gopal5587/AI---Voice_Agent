services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: ${QDRANT_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/srv/data
      - ./configs:/srv/configs
      - ./evidence:/srv/evidence
      - ./models:/srv/models

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.12.5
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
