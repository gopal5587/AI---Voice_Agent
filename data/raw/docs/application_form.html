<html><body>
<h1>Business Loan Application Form</h1>
<form id="bl-application">
  <label for="appl_name">Applicant Full Name*</label><input id="appl_name" name="appl_name" required>
  <label for="mob">Mobile No.*</label><input id="mob" name="mob" required>
  <label for="biz_nm">Name of Business*</label><input id="biz_nm" name="biz_nm" required>
  <label for="biz_type">Business Constitution</label>
  <select id="biz_type" name="biz_type"><option>Proprietorship</option><option>Partnership</option><option>Pvt Ltd</option><option>LLP</option></select>
  <label for="yrs_in_biz">Years in Business*</label><input id="yrs_in_biz" name="yrs_in_biz" type="number" required>
  <label for="ann_rev">Annual Revenue (INR)*</label><input id="ann_rev" name="ann_rev" type="number" required>
  <label for="loan_amt">Loan Amount Required (INR)*</label><input id="loan_amt" name="loan_amt" type="number" required>
  <label for="purpose">Purpose of Loan</label><input id="purpose" name="purpose">
  <label for="cibil">CIBIL Score (if known)</label><input id="cibil" name="cibil" type="number">
  <label for="dob">Date of Birth (DD-MM-YYYY)*</label><input id="dob" name="dob" required>
  <label for="pan_no">PAN*</label><input id="pan_no" name="pan_no" required>
  <label><input type="checkbox" name="consent" required> I consent to Kosha Capital fetching my credit report.</label>
</form>
</body></html>
